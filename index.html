<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khóa Học Lập Trình Giao Diện Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:italic@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .serif-title { font-family: 'Instrument Serif', Georgia, serif; }
  </style>
</head>

  <!-- BẮT ĐẦU VIẾT CODE BÀI TẬP TẠI ĐÂY -->
<body class="bg-[#F5F2EB] text-[#1A1A1A] min-h-screen flex items-center justify-center p-4"></body>
  <div class="bg-[#FAF8F5] border border-[#E3DCD1] rounded-xl p-6 md:p-12 text-center md:text-left max-w-2xl w-full">
    
    <div class="text-[11px] font-semibold tracking-widest text-[#7D766C] uppercase mb-4">
      [ 01 / Frontend Core ]
    </div>

    <h1 class="serif-title text-3xl md:text-5xl font-normal tracking-tight text-[#1A1A1A] mb-4 leading-none">
      Khóa Học Lập Trình <br class="hidden md:inline" />Giao Diện Web
    </h1>
    
    <p class="text-[#5C564E] text-base md:text-lg mb-8 leading-relaxed font-normal">
      Nắm vững tư duy Mobile-First và xây dựng website chuẩn Responsive cực nhanh với Tailwind CSS.
    </p>
    
    <div class="flex flex-col md:flex-row gap-3">
      <button class="w-full md:w-auto px-6 py-3 bg-[#1A1A1A] hover:bg-[#333333] text-[#FAF8F5] text-sm font-medium rounded-lg transition duration-150">
        Bắt đầu ngay
      </button>
      <button class="w-full md:w-auto px-6 py-3 bg-transparent hover:bg-[#EAE4D9] text-[#1A1A1A] text-sm font-medium rounded-lg border border-[#D5CCC0] transition duration-150">
        Tìm hiểu thêm
      </button>
    </div>

  </div>

</body>
</html>
